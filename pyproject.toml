[project]
name = "flux-agentic-finance-system"
version = "1.0.0"
description = "AI-powered finance platform with an autonomous, calibrated market-prediction agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nishanth S", email = "nishanth.sr.7@gmail.com" }]
keywords = ["fintech", "machine-learning", "xgboost", "fastapi", "conformal-prediction"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# This file exists for metadata and for the pytest/ruff config below — the app
# is never installed as a package (Docker and CI both install from
# backend/requirements*.txt). Without an explicit empty package list setuptools
# tries to auto-discover, finds js/, css/, pages/, backend/ and the rest side by
# side in a flat layout, and refuses to build. Any build host that spots a
# pyproject.toml and runs `pip install .` — Cloudflare Pages does — then fails
# before the real frontend build ever starts.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
minversion = "8.0"
# Only the prediction-agent suites are real tests. scripts/ holds one-shot
# research probes and training gates, never collect from there.
testpaths = ["backend/prediction"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "node_modules", "Dataset", "flux_chroma"]

[tool.ruff.lint]
# Gate on correctness, not style. This set catches syntax errors, undefined and
# redefined names, mutable default arguments, and broken comparisons/format
# strings — the things that are actually bugs. Cosmetic rules (import order,
# line length, f-string nits) are deliberately left out so CI stays a real
# signal rather than noise. Widen with ["E", "F", "W", "I", "UP", "B"] once the
# ~290 existing style violations have been cleaned up.
select = [
    "E9",    # syntax / IO errors
    "F63",   # invalid comparisons  (e.g. `is` with a literal)
    "F7",    # break/return outside a loop or function
    "F82",   # undefined names
    "F811",  # redefinition of an unused name
    "F502",  # percent-format with a dict where a tuple is expected
    "F506",  # percent-format mixing positional and named
    "F601",  # membership test against a tuple literal
    "F632",  # `is` comparison against a str/bytes/int literal
    "F702",  # `continue` outside a loop
    "F706",  # `return` outside a function
    "B006",  # mutable default argument
]

[tool.ruff.lint.per-file-ignores]
"backend/prediction/test_*.py" = ["E402"]
"scripts/*.py" = ["E402", "F401"]
